[project]
name = "ods"
version = "0.1.0"
description = "Selectable-class object detection from any camera, powered by YOLO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "ultralytics>=8.3",
    "huggingface_hub>=0.24",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ods = "ods.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
